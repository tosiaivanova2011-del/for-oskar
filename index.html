<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Оскара ✦</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient(circle at 50% 15%, #314a38 0%, #18291f 35%, #0d1712 75%);
            color: #f5ead0;
            overflow-x: hidden;
            transition: background 0.8s ease; /* Плавная смена фона */
        }

        /* Серебристо-морская тема для Трилогии 2 */
        body.sea-theme {
            background: radial-gradient(circle at 50% 15%, #2c4a5e 0%, #152936 35%, #0a141c 75%);
        }

        /* Звёзды */
        .stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .star { position: absolute; width: 3px; height: 3px; background: #fff4cf; border-radius: 50%; opacity: 0.8; animation: twinkle 3s infinite ease-in-out; }
        .star:nth-child(1) { left: 8%; top: 15%; }
        .star:nth-child(2) { left: 22%; top: 32%; animation-delay: 1s; }
        .star:nth-child(3) { left: 38%; top: 12%; animation-delay: 0.5s; }
        .star:nth-child(4) { left: 55%; top: 25%; animation-delay: 1.5s; }
        .star:nth-child(5) { left: 72%; top: 10%; animation-delay: 0.8s; }
        .star:nth-child(6) { left: 88%; top: 30%; animation-delay: 2s; }
        .star:nth-child(7) { left: 15%; top: 55%; animation-delay: 1.2s; }
        .star:nth-child(8) { left: 45%; top: 48%; animation-delay: 0.3s; }
        .star:nth-child(9) { left: 67%; top: 58%; animation-delay: 1.7s; }
        .star:nth-child(10) { left: 92%; top: 68%; animation-delay: 0.6s; }
        @keyframes twinkle { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.4); } }

        /* Элементы страницы */
        .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 45px 20px 60px; }
        .moon { position: absolute; top: 45px; right: 8%; width: 90px; height: 90px; border-radius: 50%; background: #f7e9bd; box-shadow: 0 0 25px rgba(255, 240, 180, 0.35), 0 0 70px rgba(255, 240, 180, 0.12); }
        .moon::after { content: ""; position: absolute; top: -4px; left: -10px; width: 90px; height: 90px; border-radius: 50%; background: #15251c; transition: background 0.8s ease; }
        
        body.sea-theme .moon::after { background: #11202b; }

        .title { text-align: center; max-width: 800px; margin-top: 35px; }
        .title .small { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.75; margin-bottom: 15px; }
        .title h1 { font-size: clamp(34px, 7vw, 65px); line-height: 1.1; color: #f7e8c2; text-shadow: 0 3px 20px rgba(0,0,0,0.35); }
        .title p { margin-top: 16px; font-size: 18px; line-height: 1.6; color: #d8c9a7; }

        .kitten-area { width: min(360px, 85vw); margin: 30px auto 25px; border-radius: 35px; background: rgba(245, 232, 194, 0.07); border: 1px solid rgba(245, 232, 194, 0.13); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
        .kitten { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 2px dashed rgba(239, 220, 176, 0.35); cursor: pointer; }
        .kitten-dialog { margin-top: 15px; background: rgba(245, 232, 194, 0.12); padding: 10px 15px; border-radius: 15px; text-align: center; font-size: 14px; min-height: 40px; }

        /* Сетка кнопок */
        .menu { width: min(900px, 100%); display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .menu-button { border: 1px solid rgba(245, 232, 194, 0.15); background: rgba(245, 232, 194, 0.08); color: #f5ead0; border-radius: 20px; padding: 15px 20px; cursor: pointer; text-align: left; font-family: inherit; transition: transform 0.2s ease, background 0.2s ease; }
        .menu-button:hover { transform: translateY(-3px); background: rgba(245, 232, 194, 0.14); }
        .icon { font-size: 24px; display: block; margin-bottom: 5px; }
        .menu-button strong { display: block; font-size: 17px; margin-bottom: 3px; }
        .menu-button span { font-size: 13px; color: #cbbd9e; }

        /* Блок отображения сообщений */
        .message { width: min(900px, 100%); margin-top: 30px; padding: 24px; text-align: center; border-radius: 22px; background: rgba(245, 232, 194, 0.06); border: 1px solid rgba(245, 232, 194, 0.1); color: #d8c9a7; line-height: 1.7; }
        
        /* Прогресс-бар корма */
        .progress-bar-container { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 18px; margin: 10px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: #4caf50; width: 50%; transition: width 0.3s; }
        .food-options { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .food-item { background: rgba(245, 232, 194, 0.15); border: 1px solid rgba(245, 232, 194, 0.3); color: #f5ead0; padding: 10px 15px; border-radius: 12px; cursor: pointer; }

        footer { margin-top: 45px; color: #9e947d; font-size: 13px; text-align: center; }

        @media (max-width: 600px) {
            .page { padding-top: 30px; }
            .moon { width: 60px; height: 60px; top: 25px; right: 6%; }
            .moon::after { width: 60px; height: 60px; left: -7px; top: -3px; }
            .menu { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="stars">
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    </div>

    <div class="moon"></div>

    <main class="page">
        <section class="title">
            <div class="small">✦ маленький подарок ✦</div>
            <h1>Для Оскара</h1>
            <p>Маленький мир, собранный из историй, звёзд, писем и одного очень особенного котёнка.</p>
        </section>

        <section class="kitten-area">
            <img src="kotik.png" alt="Наш котёнок" class="kitten" onclick="talkToCat()">
            <div class="kitten-dialog" id="kitten-talk">Муррр... Нажми на меня или выбери действие ниже! 💚</div>
        </section>

        <section class="menu">
            <button class="menu-button" onclick="openTrilogy1()">
                <span class="icon">📚</span>
                <strong>Книги (Трилогия 1)</strong>
                <span>Трилогия про котёнка и его путешествие.</span>
            </button>

            <button class="menu-button" id="btn-trilogy-2" onclick="openTrilogy2()">
                <span class="icon">🌊</span>
                <strong>Трилогия 2</strong>
                <span>Вторая история Оскара: Туда, где заканчиваются дороги.</span>
            </button>

            <button class="menu-button" onclick="showMessage('letters')">
                <span class="icon">💌</span>
                <strong>Письма</strong>
                <span>Послания, которые ждут своего момента.</span>
            </button>

            <button class="menu-button" onclick="showMessage('facts')">
                <span class="icon">✨</span>
                <strong>Интересные факты</strong>
                <span>Маленькие открытия на каждый день.</span>
            </button>

            <button class="menu-button" onclick="showMessage('roseBook')">
                <span class="icon">🌹</span>
                <strong>Сад, который помнит</strong>
                <span>История о розах, времени и принцессе Розарии</span>
            </button>
            
            <button class="menu-button" onclick="talkToCat()">
                <span class="icon">💬</span>
                <strong>Поговорить</strong>
                <span>Котёнок выслушает и поддержит тебя.</span>
            </button>

            <button class="menu-button feed-btn" onclick="showMessage('feed')">
                <span class="icon">🐟</span>
                <strong>Покормить котёнка</strong>
                <span>Угости малыша вкусняшкой и подними ему настроение.</span>
            </button>
        </section>

        <section class="message" id="message">
            Нажми на любую карточку — <span>котёнок пока только знакомится с тобой.</span>
        </section>

        <footer>
            Сделано с любовью 💚
        </footer>
    </main>

    <!-- Скрипты первой трилогии -->
    <script src="book1.js"></script>
    <script src="book2.js"></script>
    <script src="book3.js"></script>
    
    <!-- Скрипт логики сайта -->
    <script src="script.js"></script>
    
    <!-- Скрипты второй трилогии -->
    <script src="book1_t2.js"></script>
    <script src="book2_t2.js"></script>
    <script src="book3_t2.js"></script>
    
    <!-- Логика переключения темы и открытия книг -->
    <script>
        function openTrilogy1() {
            document.body.classList.remove('sea-theme'); // Возвращаем зеленый фон
            if (typeof showMessage === 'function') {
                showMessage('books');
            }
        }

        function openTrilogy2() {
            document.body.classList.add('sea-theme'); // Включаем серебристо-морской фон
            if (typeof showMessage === 'function') {
                showMessage('trilogy2'); // Вызываем показ 2-й трилогии
            }
        }
    </script>
</body>
</html>
